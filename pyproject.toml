[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deid-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "keyring>=25.5.0",
    "openpyxl>=3.1.5",
    "platformdirs>=4.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "pywebview>=5.3.2",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.11.0",
]

[tool.setuptools.packages.find]
include = ["app*", "core*", "llm*", "storage*"]

[tool.setuptools.package-data]
"app.resources.certs" = ["*.crt", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
